apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-gaming-ingress
  namespace: cloud-gaming
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "cloud-gaming-backend"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: gaming.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cloud-gaming-backend
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: cloud-gaming-backend
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: cloud-gaming-backend
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: cloud-gaming-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloud-gaming-frontend
                port:
                  number: 80
